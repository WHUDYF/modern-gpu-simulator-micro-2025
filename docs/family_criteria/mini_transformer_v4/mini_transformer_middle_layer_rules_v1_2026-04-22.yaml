        time_label: Medium
        local_decision_label: Medium
        decision_weight_factors:
          is_main_path: true
          has_independent_lane: true
          is_boundary_case: false
          expected_high_sensitivity: false
          is_constraint_object: false
        decision_weight_note: Output projection should remain separate to check whether front projection conclusions transfer after attention.
