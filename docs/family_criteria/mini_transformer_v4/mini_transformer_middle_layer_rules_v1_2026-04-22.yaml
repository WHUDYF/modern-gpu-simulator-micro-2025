    resource_signature_summary: reduction / synchronization; softmax is more cache-capacity and DRAM-pressure sensitive
    coverage_label: Medium
    time_label: Medium-High
    decision_label: High
    decision_weight_factors:
      is_main_path: true
      has_independent_lane: true
      is_boundary_case: true
      expected_high_sensitivity: true
      is_constraint_object: false
