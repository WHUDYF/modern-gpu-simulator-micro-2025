    <text x="82" y="159" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#155E75">核心判断：</text>
    <text x="178" y="159" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#172033">GPU 仿真加速的关键不是丢弃 trace，而是找到能代表同类结构的 kernel。</text>
  </g>
