    <text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="86" y="394">ResNet-50 一次推理产生大量 kernel 调用，</text><text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="86" y="418">逐个分析会放大模拟成本。</text></g>
