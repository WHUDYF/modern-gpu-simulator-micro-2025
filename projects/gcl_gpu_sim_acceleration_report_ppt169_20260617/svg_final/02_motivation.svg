    <text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="844" y="394">通过 embedding 聚类，把 kernel 分成主体样本</text><text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="844" y="418">与少量特殊样本，支撑后续采样模拟。</text></g>
