    <text x="78" y="76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">完整 trace 成本高，代表 kernel 是加速入口</text>
    <text x="78" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6475">MOTIVATION · 从逐 kernel 模拟转向结构相似性采样</text>
  </g>
  <g id="takeaway">
