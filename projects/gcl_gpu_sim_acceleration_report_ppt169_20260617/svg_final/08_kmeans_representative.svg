    <text x="96" y="322" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">1. 输入向量</text>
    <text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="96" y="356">265 个 kernel</text><text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="96" y="379">每个 256 维 embedding</text><text x="391" y="322" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">2. 选择 K</text>
    <text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="391" y="356">使用 silhouette</text><text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="391" y="379">评价候选聚类数</text><text x="686" y="322" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">3. 迭代聚类</text>
    <text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="686" y="356">分配最近中心</text><text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="686" y="379">更新簇均值</text><text x="981" y="322" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">4. 代表 kernel</text>
    <text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="981" y="356">选择距离簇中心</text><text fill="#5B6475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" x="981" y="379">最近的样本</text></g>
  <g id="formula-row">
    <path fill="#FFFFFF" stroke="#D8DEE9" d="M130,480 H575 A20,20 0 0 1 595,500 V556 A20,20 0 0 1 575,576 H130 A20,20 0 0 1 110,556 V500 A20,20 0 0 1 130,480 Z" />
    <text x="138" y="516" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033">聚类目标</text>
    <text x="138" y="550" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#155E75">J = sum ||zᵢ - μₖ||²</text>
    <text x="360" y="550" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">最小化簇内距离</text>
    <path fill="#FFFFFF" stroke="#D8DEE9" d="M705,480 H1150 A20,20 0 0 1 1170,500 V556 A20,20 0 0 1 1150,576 H705 A20,20 0 0 1 685,556 V500 A20,20 0 0 1 705,480 Z" />
    <text x="713" y="516" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033">代表样本准则</text>
    <text x="713" y="550" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#22C55E">arg min ||zᵢ - μₖ||</text>
    <text x="940" y="550" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">中心附近样本</text>
  </g>
