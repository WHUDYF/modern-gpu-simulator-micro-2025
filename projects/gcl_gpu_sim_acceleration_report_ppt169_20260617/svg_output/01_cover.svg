<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <g id="background-grid">
    <path d="M80 120 H1200 M80 200 H1200 M80 280 H1200 M80 360 H1200 M80 440 H1200 M80 520 H1200 M80 600 H1200" stroke="#D8DEE9" stroke-width="1" stroke-opacity="0.45"/>
