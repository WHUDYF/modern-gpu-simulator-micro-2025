    <text x="330" y="553" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="526" y="553" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="720" y="553" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
    <text x="112" y="582" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5B6475">Trace</text>
    <text x="300" y="582" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5B6475">Graph</text>
    <text x="495" y="582" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5B6475">RGCN</text>
    <text x="688" y="582" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5B6475">K-means</text>
  </g>
  <g id="right-metric">
    <rect x="980" y="214" width="214" height="210" rx="22" fill="#FFFFFF" stroke="#D8DEE9"/>
    <use data-icon="tabler-outline/bolt" x="1016" y="248" width="34" height="34" fill="#22C55E" stroke-width="2"/>
    <text x="1016" y="336" font-family="Consolas, Courier New, monospace" font-size="56" font-weight="800" fill="#155E75">265</text>
