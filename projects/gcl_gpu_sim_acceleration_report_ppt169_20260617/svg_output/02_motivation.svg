<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <g id="header">
    <rect x="56" y="48" width="6" height="34" rx="3" fill="#155E75"/>
    <text x="78" y="76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">完整 trace 成本高，代表 kernel 是加速入口</text>
    <text x="78" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6475">MOTIVATION · 从逐 kernel 模拟转向结构相似性采样</text>
  </g>
  <g id="takeaway">
    <rect x="56" y="126" width="1168" height="54" rx="14" fill="#155E75" fill-opacity="0.08" stroke="#D8DEE9"/>
    <text x="82" y="159" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#155E75">核心判断：</text>
    <text x="178" y="159" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#172033">GPU 仿真加速的关键不是丢弃 trace，而是找到能代表同类结构的 kernel。</text>
  </g>
  <g id="kpi-kernels">
    <rect x="56" y="220" width="350" height="260" rx="18" fill="#FFFFFF" stroke="#D8DEE9"/>
    <use data-icon="tabler-outline/cpu" x="86" y="252" width="34" height="34" fill="#155E75" stroke-width="2"/>
    <text x="86" y="325" font-family="Consolas, Courier New, monospace" font-size="54" font-weight="800" fill="#172033">265</text>
    <text x="86" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">kernel invocation</text>
    <text x="86" y="394" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="86" dy="0">ResNet-50 一次推理产生大量 kernel 调用，</tspan>
      <tspan x="86" dy="24">逐个分析会放大模拟成本。</tspan>
    </text>
  </g>
  <g id="kpi-trace">
    <rect x="435" y="220" width="350" height="260" rx="18" fill="#FFFFFF" stroke="#D8DEE9"/>
    <use data-icon="tabler-outline/database" x="465" y="252" width="34" height="34" fill="#2563EB" stroke-width="2"/>
    <text x="465" y="325" font-family="Consolas, Courier New, monospace" font-size="54" font-weight="800" fill="#172033">124876</text>
    <text x="465" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">CTA records</text>
    <text x="465" y="394" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="465" dy="0">完整轨迹包含 CTA、warp、指令与访存信息，</tspan>
      <tspan x="465" dy="24">信息丰富但处理代价高。</tspan>
    </text>
  </g>
  <g id="kpi-target">
    <rect x="814" y="220" width="410" height="260" rx="18" fill="#FFFFFF" stroke="#D8DEE9"/>
    <use data-icon="tabler-outline/bolt" x="844" y="252" width="34" height="34" fill="#22C55E" stroke-width="2"/>
    <text x="844" y="325" font-family="Consolas, Courier New, monospace" font-size="54" font-weight="800" fill="#155E75">K=2</text>
    <text x="844" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">representative groups</text>
    <text x="844" y="394" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="844" dy="0">通过 embedding 聚类，把 kernel 分成主体样本</tspan>
      <tspan x="844" dy="24">与少量特殊样本，支撑后续采样模拟。</tspan>
    </text>
  </g>
  <g id="bottom-logic">
    <rect x="160" y="545" width="960" height="78" rx="20" fill="#FFFFFF" stroke="#D8DEE9"/>
    <text x="206" y="593" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">完整 trace</text>
    <path d="M326 585 H450" stroke="#8792A2" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="482" y="593" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">结构表示学习</text>
    <path d="M646 585 H770" stroke="#8792A2" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="805" y="593" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#22C55E">代表 kernel 选择</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8792A2">Source: GCL GPU simulation acceleration report; ResNet-50 reproduction artifacts</text>
    <text x="1224" y="684" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8792A2">02 / 12</text>
  </g>
</svg>
