<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#155E75"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <g id="header">
    <rect x="56" y="48" width="6" height="34" rx="3" fill="#155E75"/>
    <text x="78" y="76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">整体流程：从 GPU trace 到代表 kernel</text>
    <text x="78" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6475">METHOD OVERVIEW · 轨迹构图 — 图编码 — 聚类采样</text>
  </g>
  <g id="takeaway">
    <rect x="56" y="126" width="1168" height="50" rx="14" fill="#155E75" fill-opacity="0.08" stroke="#D8DEE9"/>
    <text x="82" y="157" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#172033">每一步都有明确的中间产物，因此复现链路可以被审计、复跑和扩展。</text>
  </g>
  <g id="pipeline-frame">
    <rect x="56" y="214" width="1168" height="332" rx="22" fill="#FFFFFF" stroke="#D8DEE9"/>
    <line x1="135" y1="314" x2="1138" y2="314" stroke="#155E75" stroke-width="3" marker-end="url(#arrowHead)"/>
  </g>
  <g id="stage-trace">
    <circle cx="155" cy="314" r="34" fill="#155E75"/>
    <use data-icon="tabler-outline/database" x="139" y="298" width="32" height="32" fill="#FFFFFF" stroke-width="2"/>
    <text x="105" y="390" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">Trace 采集</text>
    <text x="105" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="105" dy="0">ResNet-50 推理</tspan>
      <tspan x="105" dy="24">NVBit full trace</tspan>
    </text>
    <rect x="104" y="474" width="130" height="34" rx="10" fill="#F7F9FC" stroke="#D8DEE9"/>
    <text x="169" y="496" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#155E75">raw trace</text>
  </g>
  <g id="stage-graph">
    <circle cx="390" cy="314" r="34" fill="#2563EB"/>
    <use data-icon="tabler-outline/binary-tree" x="374" y="298" width="32" height="32" fill="#FFFFFF" stroke-width="2"/>
    <text x="330" y="390" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">关系图构建</text>
    <text x="330" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="330" dy="0">指令节点 + 访存节点</tspan>
      <tspan x="330" dy="24">三类 typed edge</tspan>
    </text>
    <rect x="330" y="474" width="146" height="34" rx="10" fill="#F7F9FC" stroke="#D8DEE9"/>
    <text x="403" y="496" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#2563EB">graph bundle</text>
  </g>
  <g id="stage-rgcn">
    <circle cx="625" cy="314" r="34" fill="#2563EB"/>
    <use data-icon="tabler-outline/network" x="609" y="298" width="32" height="32" fill="#FFFFFF" stroke-width="2"/>
    <text x="570" y="390" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">RGCN 编码</text>
    <text x="570" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="570" dy="0">relation-aware message</tspan>
      <tspan x="570" dy="24">node → kernel readout</tspan>
    </text>
    <rect x="570" y="474" width="150" height="34" rx="10" fill="#F7F9FC" stroke="#D8DEE9"/>
    <text x="645" y="496" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#2563EB">256-d vector</text>
  </g>
  <g id="stage-kmeans">
    <circle cx="860" cy="314" r="34" fill="#22C55E"/>
    <use data-icon="tabler-outline/chart-scatter" x="844" y="298" width="32" height="32" fill="#FFFFFF" stroke-width="2"/>
    <text x="810" y="390" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">K-means 聚类</text>
    <text x="810" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="810" dy="0">silhouette 选择 K</tspan>
      <tspan x="810" dy="24">簇中心距离最小</tspan>
    </text>
    <rect x="810" y="474" width="122" height="34" rx="10" fill="#F7F9FC" stroke="#D8DEE9"/>
    <text x="871" y="496" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#22C55E">K=2</text>
  </g>
  <g id="stage-rep">
    <circle cx="1095" cy="314" r="34" fill="#155E75"/>
    <use data-icon="tabler-outline/target-arrow" x="1079" y="298" width="32" height="32" fill="#FFFFFF" stroke-width="2"/>
    <text x="1038" y="390" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">代表 kernel</text>
    <text x="1038" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
      <tspan x="1038" dy="0">每簇选择中心样本</tspan>
      <tspan x="1038" dy="24">减少后续模拟对象</tspan>
    </text>
    <rect x="1038" y="474" width="126" height="34" rx="10" fill="#F7F9FC" stroke="#D8DEE9"/>
    <text x="1101" y="496" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#155E75">anchors</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8792A2">Source: GCL-Sampler workflow; project reproduction design</text>
    <text x="1224" y="684" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8792A2">03 / 12</text>
  </g>
</svg>
