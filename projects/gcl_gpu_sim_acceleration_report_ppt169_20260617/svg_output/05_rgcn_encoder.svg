<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#155E75"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <g id="header">
    <rect x="56" y="48" width="6" height="34" rx="3" fill="#155E75"/>
    <text x="78" y="76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">RGCN 用不同关系矩阵保留边类型语义</text>
    <text x="78" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6475">RGCN ENCODER · control_flow / data_source / data_destination 分别参与消息传递</text>
  </g>
  <g id="takeaway">
    <rect x="56" y="126" width="1168" height="50" rx="14" fill="#155E75" fill-opacity="0.08" stroke="#D8DEE9"/>
    <text x="82" y="157" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#172033">普通 GCN 会把边混成一种连接；RGCN 让三类关系在参数上可区分。</text>
  </g>
  <g id="architecture">
    <rect x="70" y="215" width="1140" height="305" rx="22" fill="#FFFFFF" stroke="#D8DEE9"/>
    <g id="input-layer">
      <rect x="112" y="260" width="250" height="210" rx="18" fill="#F7F9FC" stroke="#D8DEE9"/>
      <use data-icon="tabler-outline/binary-tree" x="140" y="290" width="34" height="34" fill="#155E75" stroke-width="2"/>
      <text x="140" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">Typed Graph</text>
      <text x="140" y="388" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">
        <tspan x="140" dy="0">节点特征 X</tspan>
        <tspan x="140" dy="24">边索引 E</tspan>
        <tspan x="140" dy="24">关系类型 R</tspan>
      </text>
    </g>
    <line x1="382" y1="365" x2="458" y2="365" stroke="#155E75" stroke-width="3" marker-end="url(#arrowHead)"/>
    <g id="rgcn-layer">
      <rect x="470" y="242" width="342" height="246" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <use data-icon="tabler-outline/network" x="504" y="278" width="38" height="38" fill="#2563EB" stroke-width="2"/>
      <text x="560" y="303" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="800" fill="#172033">3-layer RGCN</text>
      <rect x="508" y="342" width="82" height="52" rx="12" fill="#EFF6FF" stroke="#D8DEE9"/>
      <rect x="610" y="342" width="82" height="52" rx="12" fill="#EFF6FF" stroke="#D8DEE9"/>
      <rect x="712" y="342" width="62" height="52" rx="12" fill="#EFF6FF" stroke="#D8DEE9"/>
      <text x="549" y="374" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#2563EB">R1</text>
      <text x="651" y="374" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#2563EB">R2</text>
      <text x="743" y="374" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#2563EB">R3</text>
      <text x="506" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">每种关系使用独立变换，聚合邻居消息并更新节点表示。</text>
    </g>
    <line x1="832" y1="365" x2="908" y2="365" stroke="#155E75" stroke-width="3" marker-end="url(#arrowHead)"/>
    <g id="output-layer">
      <rect x="920" y="260" width="250" height="210" rx="18" fill="#F7F9FC" stroke="#D8DEE9"/>
      <use data-icon="tabler-outline/layers-linked" x="948" y="290" width="34" height="34" fill="#22C55E" stroke-width="2"/>
      <text x="948" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">Kernel Embedding</text>
      <text x="948" y="400" font-family="Consolas, Courier New, monospace" font-size="44" font-weight="800" fill="#155E75">256d</text>
      <text x="948" y="438" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5B6475">固定维度向量表示</text>
    </g>
  </g>
  <g id="parameter-row">
    <rect x="110" y="558" width="232" height="74" rx="16" fill="#FFFFFF" stroke="#D8DEE9"/>
    <rect x="370" y="558" width="232" height="74" rx="16" fill="#FFFFFF" stroke="#D8DEE9"/>
    <rect x="630" y="558" width="232" height="74" rx="16" fill="#FFFFFF" stroke="#D8DEE9"/>
    <rect x="890" y="558" width="232" height="74" rx="16" fill="#FFFFFF" stroke="#D8DEE9"/>
    <text x="132" y="588" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">input_dim</text>
    <text x="132" y="617" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="800" fill="#155E75">64</text>
    <text x="392" y="588" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">hidden_dim</text>
    <text x="392" y="617" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="800" fill="#155E75">128</text>
    <text x="652" y="588" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">relation_count</text>
    <text x="652" y="617" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="800" fill="#155E75">3</text>
    <text x="912" y="588" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">loss</text>
    <text x="912" y="617" font-family="Consolas, Courier New, monospace" font-size="26" font-weight="800" fill="#155E75">InfoNCE</text>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8792A2">Source: RGCN training manifest; GCL report section 3.3-3.4</text>
    <text x="1224" y="684" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8792A2">05 / 12</text>
  </g>
</svg>
