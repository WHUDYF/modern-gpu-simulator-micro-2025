<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <g id="header">
    <rect x="56" y="48" width="6" height="34" rx="3" fill="#155E75"/>
    <text x="78" y="76" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">从节点表示逐级读出 kernel embedding</text>
    <text x="78" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B6475">READOUT HIERARCHY · node → warp → CTA → selected SM → kernel</text>
  </g>
  <g id="takeaway">
    <rect x="56" y="126" width="1168" height="50" rx="14" fill="#155E75" fill-opacity="0.08" stroke="#D8DEE9"/>
    <text x="82" y="157" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#172033">层级读出贴合 GPU 执行结构，避免把所有节点简单平均后丢失执行上下文。</text>
  </g>
  <g id="hierarchy-visual">
    <rect x="80" y="220" width="690" height="386" rx="22" fill="#FFFFFF" stroke="#D8DEE9"/>
    <polygon points="185,262 665,262 620,322 230,322" fill="#EFF6FF" stroke="#D8DEE9"/>
    <polygon points="230,338 620,338 575,398 275,398" fill="#EAF7F2" stroke="#D8DEE9"/>
    <polygon points="275,414 575,414 530,474 320,474" fill="#EFF6FF" stroke="#D8DEE9"/>
    <polygon points="320,490 530,490 495,550 355,550" fill="#EAF7F2" stroke="#D8DEE9"/>
    <rect x="355" y="564" width="140" height="42" rx="18" fill="#155E75"/>
    <text x="425" y="296" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">node</text>
    <text x="425" y="373" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">warp</text>
    <text x="425" y="449" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">CTA</text>
    <text x="425" y="525" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">selected SM</text>
    <text x="425" y="592" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">kernel</text>
    <text x="566" y="296" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2563EB">instruction / mem_ref</text>
    <text x="580" y="373" font-family="Consolas, Courier New, monospace" font-size="15" fill="#22C55E">warp-level context</text>
    <text x="548" y="449" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2563EB">thread block</text>
    <text x="520" y="525" font-family="Consolas, Courier New, monospace" font-size="15" fill="#22C55E">scheduler slice</text>
  </g>
  <g id="right-panel">
    <rect x="820" y="220" width="404" height="386" rx="22" fill="#FFFFFF" stroke="#D8DEE9"/>
    <use data-icon="tabler-outline/layers-linked" x="854" y="256" width="36" height="36" fill="#155E75" stroke-width="2"/>
    <text x="904" y="282" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#172033">为什么分层读出？</text>
    <g id="reason-1">
      <rect x="854" y="326" width="320" height="62" rx="14" fill="#F7F9FC" stroke="#D8DEE9"/>
      <text x="878" y="352" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033">保留 GPU 执行层级</text>
      <text x="878" y="375" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">warp / CTA / SM 是真实调度单位</text>
    </g>
    <g id="reason-2">
      <rect x="854" y="412" width="320" height="62" rx="14" fill="#F7F9FC" stroke="#D8DEE9"/>
      <text x="878" y="438" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033">减少图规模噪声</text>
      <text x="878" y="461" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">逐级聚合比全图平均更稳定</text>
    </g>
    <g id="reason-3">
      <rect x="854" y="498" width="320" height="62" rx="14" fill="#F7F9FC" stroke="#D8DEE9"/>
      <text x="878" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#172033">输出固定维度表示</text>
      <text x="878" y="547" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5B6475">每个 kernel 最终得到 256 维向量</text>
    </g>
  </g>
  <g id="footer">
    <text x="56" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8792A2">Source: RGCN training manifest: readout_hierarchy=node_to_warp_to_cta_to_selected_sm_to_kernel</text>
    <text x="1224" y="684" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8792A2">06 / 12</text>
  </g>
</svg>
