    <text x="190" y="608" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">最终结论：</text>
    <text x="286" y="608" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#FFFFFF">本课程报告完成了从真实 trace 到代表 kernel 选择的端到端复现，并得到约 132.5 倍理论模拟加速。</text>
